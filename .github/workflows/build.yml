name: Build Windows x64
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test device selection and toggle logic
        run: dotnet run --project tests/AudioSwitch.Tests -c Release
      - name: Smoke test COM activation and enumeration (no switching)
        run: dotnet run --project tests/AudioSwitch.Tests -c Release -- --com-smoke
      - name: Upload COM diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AudioSwitch-COM-diagnostics
          path: ~/AppData/Local/AudioSwitch/AudioSwitch.log*
          if-no-files-found: ignore
      - name: Publish portable Windows x64 executable
        run: dotnet publish src/AudioSwitch/AudioSwitch.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/win-x64/AudioSwitch.exe)) { throw 'AudioSwitch.exe was not produced' }
      - uses: actions/upload-artifact@v4
        with:
          name: AudioSwitch-win-x64
          path: artifacts/win-x64/AudioSwitch.exe
          if-no-files-found: error
          retention-days: 30
